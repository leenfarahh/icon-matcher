# Render blueprint for the Claude connector (app/connector.py). Setup: app/connector-setup.md.
# Only the connector runs here: the test UI (app.main) has no protection and is never deployed.
services:
  - type: web
    name: prezlab-icons
    runtime: docker         # the Dockerfile: Python 3.12 plus LibreOffice, for slide pictures; it holds the start command
    dockerfilePath: ./Dockerfile
    plan: standard          # 2 GB: LibreOffice needs a few hundred MB while it makes slide pictures (starter: 512 MB)
    region: frankfurt       # where uploaded client decks are processed, kept only while in use (ICON_RUN_IDLE_HOURS)
    branch: main
    healthCheckPath: /health
    disk:                   # one instance with a disk: runs live on it and are processed in this instance
      name: runs
      mountPath: /var/data
      sizeGB: 5
    envVars:
      - key: ICON_LIBRARY_DIR
        value: ./icons
      - key: ICON_WORK_DIR
        value: /var/data/runs
      # Designers don't sign in: the connector's address is /mcp/<this secret> (connector-setup.md makes one).
      - key: ICON_MCP_SECRET
        sync: false
      - key: ANTHROPIC_API_KEY    # Claude picks the icons; without it, keyword matching (rougher picks)
        sync: false
      # The web page for people without Claude (/web): Odoo sign-in, with Image Studio's values. Empty: the page is off.
      - key: ODOO_URL
        sync: false
      - key: ODOO_DB
        sync: false
      - key: ODOO_ALLOWED_EMAIL_DOMAIN
        value: prezlab.com
